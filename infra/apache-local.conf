<VirtualHost 127.0.0.1:80>
    ServerName teryfoto
    DocumentRoot "C:/webs/teryfoto/public"
    <Directory "C:/webs/teryfoto/public">
        Options -Indexes
        AllowOverride None
        Require local
        DirectoryIndex index.php
    </Directory>
    ErrorLog "logs/teryfoto-error.log"
    CustomLog "logs/teryfoto-access.log" combined
</VirtualHost>
